name: Build and Sign Piper TTS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (for caching)
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Step 1: Auto-Generate Keystore (No secrets required)
      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -alias piper_android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      # Step 2: Build APK
      - name: Build APK
        run: |
          ./gradlew assembleRelease --stacktrace
          
          # Find the generated APK
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned.apk
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk unsigned.apk
          else
            echo "APK not found! Listing contents:"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi

      # Step 3: Sign with apksigner
      - name: Sign APK with apksigner
        run: |
          # ubuntu-latest has Android SDK pre-installed at this path
          export ANDROID_HOME=/usr/local/lib/android/sdk
          APKSIGNER=$(find "$ANDROID_HOME" -name "apksigner" -type f | head -n 1)
          
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in Android SDK!"
            exit 1
          fi

          echo "Signing APK with: $APKSIGNER"
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-key-alias piper_android \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out piper-tts-signed.apk \
            unsigned.apk

      # Step 4: Verify Signature
      - name: Verify APK Signature
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          APKSIGNER=$(find "$ANDROID_HOME" -name "apksigner" -type f | head -n 1)
          "$APKSIGNER" verify --verbose piper-tts-signed.apk

      # Step 5: Upload Artifact
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Piper-TTS-App
          path: piper-tts-signed.apk
          retention-days: 30
