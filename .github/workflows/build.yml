name: Build and Sign Piper TTS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 🎯 Download PRE-CONVERTED sherpa-onnx compatible Piper model
      # This package includes: .onnx model + tokens.txt + espeak-ng-data
      - name: Download Sherpa-ONNX Piper Model (Pre-Converted)
        run: |
          echo "📦 Downloading pre-converted sherpa-onnx Piper model..."
          curl -L -o piper-model.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-piper-en_US-lessac-medium.tar.bz2"
          
          echo "📂 Extracting model files..."
          tar -xjf piper-model.tar.bz2
          
          echo "📁 Preparing assets folder..."
          mkdir -p app/src/main/assets/piper-model/
          
          # Copy all required files into assets
          cp -r sherpa-onnx-piper-en_US-lessac-medium/* app/src/main/assets/piper-model/
          
          echo "✅ Verifying extracted files:"
          ls -lh app/src/main/assets/piper-model/
          echo ""
          echo "📋 Contents of espeak-ng-data (if present):"
          ls app/src/main/assets/piper-model/espeak-ng-data/ 2>/dev/null | head -5 || echo "No espeak-ng-data folder"

      # 🔑 Auto-Generate Keystore with "Endless" Validity
      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -alias piper_android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2900000 \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      # 🏗️ Build APK
      - name: Build APK
        run: |
          ./gradlew assembleRelease --stacktrace
          
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned.apk
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk unsigned.apk
          else
            echo "APK not found!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi

      # ✍️ Sign with apksigner
      - name: Sign APK with apksigner
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          APKSIGNER=$(find "$ANDROID_HOME" -name "apksigner" -type f | head -n 1)
          
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in Android SDK!"
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-key-alias piper_android \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out piper-tts-signed.apk \
            unsigned.apk

      # ✅ Verify Signature
      - name: Verify APK Signature
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          APKSIGNER=$(find "$ANDROID_HOME" -name "apksigner" -type f | head -n 1)
          "$APKSIGNER" verify --verbose piper-tts-signed.apk

      # 📦 Upload Artifact
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Piper-TTS-App
          path: piper-tts-signed.apk
          retention-days: 30
