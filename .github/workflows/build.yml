name: Build and Sign Piper TTS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Generate wrapper if missing
      - name: Generate Gradle Wrapper (if missing)
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generating gradle wrapper..."
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x ./gradlew

      # Step 1: Auto-Generate Keystore
      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -alias piper_android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      # Step 2: Build APK
      - name: Build APK
        run: |
          ./gradlew assembleRelease --stacktrace
          
          # Find the APK
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned.apk
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk unsigned.apk
          else
            echo "APK not found!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi

      # Step 3: Sign with apksigner
      - name: Sign APK with apksigner
        run: |
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" -type f | head -n 1)
          
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found!"
            exit 1
          fi

          $APKSIGNER sign \
            --ks debug.keystore \
            --ks-key-alias piper_android \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out piper-tts-signed.apk \
            unsigned.apk

      # Step 4: Verify Signature
      - name: Verify APK Signature
        run: |
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" -type f | head -n 1)
          $APKSIGNER verify --verbose piper-tts-signed.apk

      # Step 5: Upload Artifact
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Piper-TTS-App
          path: piper-tts-signed.apk
          retention-days: 30
