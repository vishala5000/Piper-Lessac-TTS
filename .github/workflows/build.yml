name: Build and Sign Piper TTS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 🌟 NEW STEP: Download models from your GitHub Release into the assets folder
      - name: Download Piper Models to Assets
        run: |
          mkdir -p app/src/main/assets/
          echo "Downloading en_US-lessac-medium.onnx..."
          curl -L -o app/src/main/assets/en_US-lessac-medium.onnx "https://github.com/vishala5000/Piper-Lessac-TTS/releases/download/piper/en_US-lessac-medium.onnx"
          echo "Downloading en_US-lessac-medium.onnx.json..."
          curl -L -o app/src/main/assets/en_US-lessac-medium.onnx.json "https://github.com/vishala5000/Piper-Lessac-TTS/releases/download/piper/en_US-lessac-medium.onnx.json"
          
          echo "Verifying downloaded files:"
          ls -lh app/src/main/assets/

      # Step 1: Auto-Generate Keystore with "Endless" Validity
      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -alias piper_android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2900000 \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      # Step 2: Build APK (Now includes the downloaded assets)
      - name: Build APK
        run: |
          ./gradlew assembleRelease --stacktrace
          
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned.apk
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk unsigned.apk
          else
            echo "APK not found!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi

      # Step 3: Sign with apksigner
      - name: Sign APK with apksigner
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          APKSIGNER=$(find "$ANDROID_HOME" -name "apksigner" -type f | head -n 1)
          
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in Android SDK!"
            exit 1
          fi

          echo "Signing APK with: $APKSIGNER"
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-key-alias piper_android \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out piper-tts-signed.apk \
            unsigned.apk

      # Step 4: Verify Signature
      - name: Verify APK Signature
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          APKSIGNER=$(find "$ANDROID_HOME" -name "apksigner" -type f | head -n 1)
          "$APKSIGNER" verify --verbose piper-tts-signed.apk

      # Step 5: Upload Artifact
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Piper-TTS-App
          path: piper-tts-signed.apk
          retention-days: 30
