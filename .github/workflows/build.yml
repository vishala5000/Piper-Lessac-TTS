name: Build and Sign Piper TTS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 🎯 SMART DOWNLOAD: Uses GitHub API to find the correct Piper model
      - name: Find and Download Sherpa-ONNX Piper Model
        run: |
          echo "🔍 Searching for Piper Lessac model in sherpa-onnx releases..."
          
          # Query GitHub API for all assets in tts-models release
          RELEASE_INFO=$(curl -s "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/tts-models")
          
          # Find the Piper Lessac medium model (try multiple possible names)
          MODEL_URL=$(echo "$RELEASE_INFO" | grep -oE '"browser_download_url":\s*"[^"]*piper[^"]*lessac[^"]*medium[^"]*\.tar\.bz2"' | head -1 | sed 's/.*"browser_download_url":\s*"//;s/"$//')
          
          if [ -z "$MODEL_URL" ]; then
            echo "❌ Piper Lessac model not found. Listing all available TTS models:"
            echo "$RELEASE_INFO" | grep -oE '"name":\s*"[^"]*\.tar\.bz2"' | head -20
            exit 1
          fi
          
          echo "✅ Found model: $MODEL_URL"
          echo "📦 Downloading..."
          curl -L -o piper-model.tar.bz2 "$MODEL_URL"
          
          echo "📂 Extracting..."
          tar -xjf piper-model.tar.bz2
          
          # Find the extracted folder (name may vary)
          EXTRACTED_DIR=$(ls -d sherpa-onnx-piper-* 2>/dev/null | head -1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "❌ Extraction failed. Contents:"
            ls -la
            exit 1
          fi
          
          echo "📁 Preparing assets from: $EXTRACTED_DIR"
          mkdir -p app/src/main/assets/piper-model/
          cp -r "$EXTRACTED_DIR"/* app/src/main/assets/piper-model/
          
          echo "✅ Final assets structure:"
          find app/src/main/assets/piper-model/ -type f | head -20
          echo ""
          echo "📋 File sizes:"
          du -sh app/src/main/assets/piper-model/*

      # 🔑 Auto-Generate Keystore
      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -alias piper_android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2900000 \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      # 🏗️ Build APK
      - name: Build APK
        run: |
          ./gradlew assembleRelease --stacktrace
          
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned.apk
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk unsigned.apk
          else
            echo "APK not found!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi

      # ✍️ Sign with apksigner
      - name: Sign APK with apksigner
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          APKSIGNER=$(find "$ANDROID_HOME" -name "apksigner" -type f | head -n 1)
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-key-alias piper_android \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out piper-tts-signed.apk \
            unsigned.apk

      # ✅ Verify Signature
      - name: Verify APK Signature
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          APKSIGNER=$(find "$ANDROID_HOME" -name "apksigner" -type f | head -n 1)
          "$APKSIGNER" verify --verbose piper-tts-signed.apk

      # 📦 Upload Artifact
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Piper-TTS-App
          path: piper-tts-signed.apk
          retention-days: 30
